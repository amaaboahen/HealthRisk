name: Runtime and startup regression tests
on:
  push:
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Community Cloud runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Check dependencies and run all tests
        run: |
          python -m pip check
          python -m pytest -q
